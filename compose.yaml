x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

name: hub

services:
  web:
    <<: *hardening
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    build:
      context: .
    image: git.killobyte.es/gallardo7761/hub-web:${WEB_VERSION:-latest}
    container_name: hub-web
    restart: unless-stopped
    networks:
      - proxy_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy_net:
    external: true
